[package]
name = "logibat-tray"
version = "0.1.0"
edition = "2021"
description = "Tray app that shows the battery status of Logitech G522 and G PRO X SUPERLIGHT 2"
license = "GPL-3.0-only"
publish = false

[dependencies]
log = "0.4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
simplelog = "0.12"
tao = "0.37"
tray-icon = "0.26"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
